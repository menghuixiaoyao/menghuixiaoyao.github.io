<title>梦回逍遥 · 文字修仙</title>
<style>
:root{
  --bg:#16131f; --panel:#221d2e; --panel2:#2b2539; --line:#3a3350;
  --text:#ece6d8; --dim:#a39cb3; --gold:#e8c26a; --red:#e8685a; --green:#6fd08c;
  --blue:#6aa8e8; --purple:#b48cf0; --orange:#f0a35a;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:15px;line-height:1.55;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;border:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
header{padding:calc(8px + var(--safe-t)) 12px 8px;background:linear-gradient(180deg,#2a2238,#1d1828);border-bottom:1px solid var(--line);flex:none}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:18px;margin:0;color:var(--gold);letter-spacing:2px;flex:1;user-select:none}
.lvl{font-weight:700;color:var(--gold)}
.icon-btn{background:var(--panel2);border-radius:8px;padding:4px 10px;font-size:14px;color:var(--dim)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:6px}
.bar{position:relative;height:16px;background:#130f1b;border-radius:8px;overflow:hidden;font-size:11px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .3s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000}
.bar.hp i{background:linear-gradient(90deg,#2a8a3a,#4ac05a)}
.bar.mp i{background:linear-gradient(90deg,#3c6fb0,#6aa8e8)}
.bar.mp.xian i{background:linear-gradient(90deg,#7b2ff7,#b388ff)}
@keyframes pkshake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,3px)}}
#combat.shake{animation:pkshake .3s}
@keyframes hithurt{0%{filter:brightness(2)}100%{filter:brightness(1)}}
.bar.hp.hurt i{animation:hithurt .4s}
.bl .critdmg{font-size:16px;font-weight:bold;color:#ff5252}
.bar.hp{position:relative;overflow:visible}
.bar.hp .ghost{position:absolute;top:0;left:0;height:100%;background:rgba(255,80,80,.65);transition:width .8s ease-out;pointer-events:none}
@keyframes dmgup{0%{opacity:0;transform:translateY(4px) scale(.7)}12%{opacity:1;transform:translateY(0) scale(1.2)}25%{transform:translateY(-4px) scale(1);opacity:1}65%{opacity:1;transform:translateY(-26px)}100%{opacity:0;transform:translateY(-46px) scale(.92)}}
.dmgnum{position:absolute;right:8px;top:0;font-size:16px;font-weight:bold;color:#ff5252;text-shadow:0 1px 3px rgba(0,0,0,.6);animation:dmgup 1.8s ease-out forwards;pointer-events:none;z-index:2}
.floatxt{position:absolute;left:50%;top:-2px;transform:translateX(-50%);font-size:15px;font-weight:bold;pointer-events:none;z-index:3;white-space:nowrap}
@keyframes dodgeSlide{0%{opacity:0;transform:translateX(-50%) translateX(0)}15%{opacity:1}60%{opacity:1;transform:translateX(-50%) translateX(22px)}100%{opacity:0;transform:translateX(-50%) translateX(36px)}}
.floatxt.dodge{color:#7ec8ff;text-shadow:0 1px 3px rgba(0,0,0,.6);animation:dodgeSlide 1.6s ease-out forwards}
@keyframes dodgeMove{0%{transform:translateX(0)}25%{transform:translateX(28px)}55%{transform:translateX(28px)}100%{transform:translateX(0)}}
.turnbanner{text-align:center;padding:8px;margin:6px 0;border-radius:8px;font-weight:bold;font-size:16px}.turnbanner.me{background:#1a3a6a;color:#9ed0ff;border:2px solid #4287f5}.turnbanner.foe{background:#6a1a1a;color:#ffb3b3;border:2px solid #f54242}
.dodging{animation:dodgeMove .95s ease-out}
@keyframes lungeUp{0%{transform:translateY(0)}35%{transform:translateY(-24px)}100%{transform:translateY(0)}}
@keyframes lungeDown{0%{transform:translateY(0)}35%{transform:translateY(24px)}100%{transform:translateY(0)}}
.cf.lunge-up{animation:lungeUp .5s ease-out}
.cf.lunge-down{animation:lungeDown .5s ease-out}
@keyframes critPop{0%{opacity:0;transform:translateX(-50%) scale(.4)}16%{opacity:1;transform:translateX(-50%) scale(1.45)}32%{transform:translateX(-50%) scale(1);opacity:1}68%{opacity:1;transform:translateX(-50%) translateY(-16px)}100%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(1.05)}}
.floatxt.crit{color:#ff9800;font-size:19px;text-shadow:0 2px 5px rgba(0,0,0,.7);animation:critPop 1.8s ease-out forwards}
@keyframes blockShake{0%{opacity:0;transform:translateX(-50%)}12%{opacity:1;transform:translateX(calc(-50% - 5px))}24%{transform:translateX(calc(-50% + 5px))}36%{transform:translateX(calc(-50% - 3px))}48%{transform:translateX(-50%);opacity:1}72%{opacity:1;transform:translateX(-50%) translateY(-8px)}100%{opacity:0;transform:translateX(-50%) translateY(-18px)}}
.floatxt.block{color:#ffd700;text-shadow:0 1px 3px rgba(0,0,0,.6);animation:blockShake 1.7s ease-out forwards}
.bar.mp.over i{background:linear-gradient(90deg,#1a3a6c,#2a6ab0)}
.bar.mp.xian.over i{background:linear-gradient(90deg,#8a1a1a,#e04040)}
.bar.vig i{background:linear-gradient(90deg,#a67c52,#d4a574)}
.bar.xp i{background:linear-gradient(90deg,#b8860b,#ffd700)}
#manaNeedWrap.xp i,.bar.xp i{background:linear-gradient(90deg,#b8860b,#ffd700)}
.bar.xp i{background:linear-gradient(90deg,#a8862e,#e8c26a)}
.bar.alc i{background:linear-gradient(90deg,#6d4fb0,#b48cf0)}
.rk1{color:#d6d3dc}.rk2{color:#4f9dff;font-weight:600}.rk3{color:#5fe07a;font-weight:700}.rk4{color:#ff9a2e;font-weight:700}.rk5{color:#ff4d4d;font-weight:800;text-shadow:0 0 6px rgba(255,80,80,.5)}
.scene{background:#1a1424;border:1px solid #3a2d52;border-radius:10px;padding:10px 12px;line-height:1.7;margin:6px 0 10px;font-size:14px}
.bar.mana i{background:linear-gradient(90deg,#2a8f9a,#5fd8e0)}
.attrs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}
.attr{background:var(--panel2);border-radius:8px;text-align:center;padding:3px 0 2px}
.attr small{display:block;font-size:11px;color:var(--dim);line-height:1.2}
.attr b{font-size:16px}
.meta{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--dim)}
.meta b{color:var(--text)}
.stam b{color:var(--green);font-size:15px}
#log{flex:1;overflow-y:auto;padding:10px 12px 16px;-webkit-overflow-scrolling:touch}
.e{margin:0 0 8px;padding:8px 10px;background:var(--panel);border-radius:10px;border-left:3px solid var(--line);animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.e.sys{border-left-color:var(--dim);color:var(--dim);font-size:13px}
.e.good{border-left-color:var(--green)} .e.bad{border-left-color:var(--red)}
.e.gold{border-left-color:var(--gold)} .e.alc{border-left-color:var(--purple)} .e.pk{border-left-color:var(--orange)}
.e .ts{float:right;font-size:11px;color:#6d6680;margin-left:6px}
.e details{margin-top:4px;font-size:12.5px;color:#cfc8dc}
.e summary{color:var(--dim);cursor:pointer}
.bl{padding:1px 0}
.bl.rd{color:#7d7592;font-size:11px;margin-top:3px}
b.p{color:var(--blue)} b.x{color:var(--red)} .g{color:var(--green)} .r{color:var(--red)} .y{color:var(--gold)} .pu{color:var(--purple)}
.q3{color:#f0a35a;font-weight:700}.q2{color:#6aa8e8}.q1{color:#a39cb3}.gq1{color:#e6e3ea}.gq2{color:#4fd06a}.gq3{color:#4f9dff;font-weight:600}.gq4{color:#b77cff;font-weight:700}.gq5{color:#ff9a2e;font-weight:700}.toolRainbow{background:linear-gradient(90deg,#ff5f57,#ff9f43,#ffd93d,#6bcb77,#4d96ff,#9b5de5);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
#bcBanner{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:linear-gradient(90deg,#3a2410,#6b4210,#3a2410);border-bottom:2px solid #ff9a2e;color:#ffe9c4;text-align:center;font-size:13px;font-weight:700;padding:8px 10px;animation:bcIn .3s ease-out}
@keyframes bcIn{from{transform:translateY(-100%)}to{transform:translateY(0)}}
#combat{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:8px 12px;display:none}
#combat.on{display:block}
body.combating .bars{display:none} /* v837 战斗时隐藏顶部血条法条 */
.cf{display:grid;grid-template-columns:64px 1fr 1fr;gap:4px 8px;align-items:center;font-size:12px;margin-bottom:4px;position:relative}
.cf .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.cf .shield{color:var(--gold);font-size:11px}
nav#actions{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px calc(10px + var(--safe-b));background:#1d1828;border-top:1px solid var(--line);margin-top:auto} /* v489 主界面也贴底 */
.act{background:var(--panel2);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.act:active:not(:disabled){transform:scale(.97);background:#342d45}
.act .t{font-size:16px;font-weight:700}
.act .s{font-size:11px;color:var(--dim)}
.act.primary{background:linear-gradient(180deg,#5a4520,#3d2f18);color:var(--gold)}
.act.white{background:linear-gradient(180deg,#f0f0f0,#c8c8c8);color:#222}
.act.gold{background:linear-gradient(180deg,#a8842a,#6b5518);color:#ffe9a8}
/* 战斗界面紧凑化：大幅减小占屏 */
nav#actions:not(.main){gap:2px;padding:2px 4px calc(2px + var(--safe-b));margin-top:auto} /* v476 再缩小贴底；v826 还原v822/v825的遮挡，日志可见 */
nav#actions:not(.main) .act{padding:2px 1px;border-radius:6px}
nav#actions:not(.main) .act .t{font-size:11px}
nav#actions:not(.main) .act .s{font-size:8px}
#combat .cf{padding:2px 0}
#combat{font-size:12px}
.act.danger{background:linear-gradient(180deg,#5a2620,#3d1a16)}
.act.skill{background:linear-gradient(180deg,#2c3a5c,#1f2940)}
/* 主界面 7 个按钮：上排 4 个、下排 3 个（12 栅格） */
nav#actions.main{grid-template-columns:repeat(12,1fr);gap:7px}
nav#actions.main .act{grid-column:span 3;padding:8px 2px}
#mainMenuDrop2 .act,#mainMenuDrop .act{grid-column:auto !important}
nav#actions.main .act:nth-child(n+5){grid-column:span 4}
nav#actions.main .act .t{font-size:15px}
.meta .gold b{color:var(--gold)}
#sheet h3{margin:12px 0 2px;font-size:13px;color:var(--dim);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px}
.btn.on{background:#2f5a3a;color:#bff0c8}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--panel2);color:var(--dim);margin-left:4px}
.warn{background:#3d1a16;color:#ffb3aa;border-radius:8px;padding:6px 10px;font-size:12.5px;margin-bottom:8px}
#debugBtn{display:none}
body.debug #debugBtn{display:inline-block}
/* sheet */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10;align-items:flex-end;justify-content:center}
#mask.on{display:flex}
#sheet{width:100%;max-width:640px;max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(34,29,46,.92);border-radius:18px 18px 0 0;padding:14px 14px calc(16px + var(--safe-b));animation:up .2s ease}
#sheet.full{max-width:100%;max-height:100vh;height:100vh;border-radius:0;animation:none;display:flex;flex-direction:column;padding:12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
#sheet h2{margin:0 0 4px;font-size:17px;color:var(--gold)}
#sheet .hint{font-size:12.5px;color:var(--dim);margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .lab{flex:1}
.row .lab small{color:var(--dim);display:block;font-size:12px}
.btn{background:var(--panel2);border-radius:10px;padding:8px 14px;font-size:14px}
.btn.gold{background:#5a4520;color:var(--gold)} .btn.red{background:#5a2620;color:#ffb3aa}
.btn.full{width:100%;margin-top:10px;padding:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{color:var(--dim);text-align:center;padding:20px 0}
/* leave room for host badge (aired.sh) if injected */
body:has(#__aired-bar) nav#actions{padding-bottom:calc(46px + var(--safe-b))}
body:has(#__aired-bar) #sheet{padding-bottom:calc(50px + var(--safe-b))}
.chat-msg{padding:4px 2px;font-size:14px;line-height:1.4}
.chat-msg b{color:#ffd700}
.chat-sys{padding:4px 2px;font-size:13px;color:#ff9f43;text-align:center}
.agrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:320px;margin:8px auto}
.acell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:22px;background:#16161e;border:1px solid #333;border-radius:8px}
.acell.me{background:#3a2f10;border-color:#ffd700;box-shadow:0 0 6px #ffd70066}
.acell.exit{background:#0e2f1a;border-color:#22c55e}
.dpad{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0}
.dpad>div{display:flex;gap:6px}
.dpad .btn{min-width:60px;min-height:46px;font-size:20px}
.chat-announce{padding:8px 6px;font-size:14px;font-weight:bold;color:#ffd700;text-align:center;background:linear-gradient(90deg,transparent,#4a3200,transparent);border-top:1px solid #8a6d00;border-bottom:1px solid #8a6d00;margin:4px 0}
/* v446 日记已并入聊天窗tab，移除独立悬浮窗样式 */
#chatFloat{position:fixed;left:8px;right:8px;bottom:calc(88px + var(--safe-b));z-index:41;pointer-events:none;font-size:10px;display:none} /* v502 底部固定；v506 取中 */
#chatFloat.on{display:block;pointer-events:auto}
#chatFloat .cfbox{background:transparent;border:none;border-radius:0;overflow:hidden} /* v515 全透明去框 */
#chatFloat .cfbox{position:relative;display:flex;flex-direction:column;min-height:0;height:122px} /* v502 默认高220；v1165 Ye 定固定8行：行高11.5x8=92+拉手14+内边距16=122 */
#chatFloat .cfresize{position:absolute;right:2px;bottom:2px;width:22px;height:22px;cursor:nwse-resize;touch-action:none;z-index:5}
#chatFloat .cftop{height:14px;cursor:ns-resize;touch-action:none;display:flex;align-items:center;justify-content:center;flex:none;position:relative} /* v502 顶部拉手 */

#chatFloat .cftop::after{content:'';width:40px;height:4px;border-radius:2px;background:#666}
#chatFloat .cfresize::after{content:'';position:absolute;right:4px;bottom:4px;width:10px;height:10px;border-right:3px solid #888;border-bottom:3px solid #888;border-bottom-right-radius:4px}
#chatFloat .cftabs{display:flex;border-bottom:1px solid #444}
#chatFloat .cftabs button{flex:1;padding:6px 4px;background:none;border:none;color:#888;font-size:11px;cursor:pointer} /* v496 */
#chatFloat .cftabs button.cur{color:#ffd700;border-bottom:2px solid #ffd700;font-weight:bold}
#chatFloat .cficons{display:flex;gap:2px;padding:4px 6px;border-top:1px solid #333} /* v500 左下角小图标 */
#chatFloat .cficons button{background:none;border:none;font-size:16px;padding:2px 6px;cursor:pointer;opacity:.45;border-radius:6px}
#chatFloat .cficons button.cur{opacity:1;background:#2a2a3a}
#chatFloat .cfmsgs{flex:1;overflow-y:auto;padding:8px;min-height:60px;background:transparent}
#chatFloat .cfmsgs .chat-msg{border-left:3px solid #7ec8ff;padding:0 6px;margin:0;font-size:10px;line-height:1.15;color:#d8d8e8} /* v514 紧贴不空行 */
#chatFloat .cfmsgs .de{border-left:3px solid var(--dim);padding:0 6px;margin:0;font-size:10px;line-height:1.15;color:#d8d8e8} /* v514 */
#chatFloat .cfmsgs .de.good{border-left-color:var(--green)} #chatFloat .cfmsgs .de.bad{border-left-color:var(--red)} #chatFloat .cfmsgs .de.warn{border-left-color:var(--gold)}
#chatFloat .cfinput{display:flex;gap:6px;padding:8px;border-top:1px solid #444}
#chatFloat .cfinput input{flex:1;padding:6px 8px;border-radius:6px;border:1px solid #555;background:#222;color:#fff;font-size:12px}
#chatFloat .cfinput button{padding:6px 12px;border-radius:6px;border:none;background:#b8860b;color:#fff;font-size:12px;cursor:pointer}
</style>
